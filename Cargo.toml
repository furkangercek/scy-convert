[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build` skips the GPUI app. Build it with `cargo build -p scyconvert-app`.
default-members = [
  "crates/scyconvert-core",
  "crates/scyconvert-engines",
  "crates/scyconvert-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/opencoredev/scyconvert"
authors = ["Scyconvert"]

[patch.crates-io]
# gpui-pre-macos 0.3.7 unwraps NSString UTF-8 pointers while GPUI is starting.
# Keep the fix local until the upstream release containing the safe conversion.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[workspace.dependencies]
scyconvert-core = { path = "crates/scyconvert-core" }
scyconvert-engines = { path = "crates/scyconvert-engines" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "6"
futures = "0.3.34"
gpui-kit = "0.7.0" # GPUI + platform + gpui-component, version-matched
image = "0.25.10"
libc = "0.2"
libloading = "0.8.9"
pdfium-render = "0.9.4"
resvg = "0.48.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
