[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build` skips the GPUI app. Build it with `cargo build -p convt-app`.
default-members = [
  "crates/convt-core",
  "crates/convt-engines",
  "crates/convt-cli",
  "crates/convt-license",
  "crates/convt-update",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/opencoredev/convt"
authors = ["Convt"]

[patch.crates-io]
# gpui-pre-macos 0.3.7 unwraps NSString UTF-8 pointers while GPUI is starting.
# Keep the fix local until the upstream release containing the safe conversion.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[workspace.dependencies]
convt-core = { path = "crates/convt-core" }
convt-engines = { path = "crates/convt-engines" }
convt-license = { path = "crates/convt-license" }
convt-update = { path = "crates/convt-update" }

anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "6"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
getrandom = "0.3"
gpui-kit = "0.7.0" # GPUI + platform + gpui-component, version-matched
image = "0.25.10"
keyring = "4.2.0"
libc = "0.2"
libloading = "0.8.9"
pdfium-render = "0.9.4"
resvg = "0.48.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
