[package]
name = "scyconvert-app"
description = "scyconvert desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "scyconvert-app"
path = "src/main.rs"

[dependencies]
scyconvert-core.workspace = true
scyconvert-engines.workspace = true
dirs.workspace = true
futures.workspace = true
gpui-kit.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree through GPUI; used for the Services menu provider.
objc = "0.2.7"

[lints.rust]
# objc 0.2's `msg_send!` expands to a `feature = "cargo-clippy"` check.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
image.workspace = true
tempfile.workspace = true

[build-dependencies]
winresource = "0.1.31"
